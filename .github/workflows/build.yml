name: Crear APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar herramientas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev build-essential ccache

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv setuptools

      - name: Fijar la versión del NDK de Android
        run: sed -i '/^android.archs/a android.ndk = 25b' buildozer.spec

      - name: Construir el APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Mostrar el error real
        if: failure()
        run: |
          echo "====== LINEAS CON ERROR ======"
          grep -n -E "Command failed|\[ERROR\]|error:|Error:|Traceback|FAILED|fatal" build.log | grep -v "DEBUG.*warning" | tail -n 40 || true
          echo "====== ULTIMAS LINEAS ======"
          tail -n 60 build.log

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: moodle-fabi-apk
          path: bin/*.apk
